name: Stage 0 Spike CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify-spike:
    name: Typecheck, Differential Parity, DICOM SHA-256 & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify zero runtime vulnerabilities
        run: npm audit --omit=dev

      - name: Strict TypeScript check
        run: npm run typecheck

      - name: Run Vitest suites (Golden Python Parity, DICOM Codecs, Coordinates, Purity)
        run: npm test

      - name: Production Vite + WASM Worker build
        run: npm run build
